<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>XRPLTODAY Admin</title>
<style>
:root{--bg:#06090f;--panel:#0d131d;--line:#1b2536;--text:#e8eefb;--mu:#8fa0bd;--blue:#3d8bff;--cyan:#59c6ff;--up:#35d6a0;--dn:#ff5d73;--grad:linear-gradient(135deg,#1f5cff,#3d8bff 50%,#59c6ff)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 10% -10%,rgba(61,139,255,.18),transparent),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--cyan);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:-.5px}h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px}
input,select,textarea{background:#0a0f18;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
button{border:1px solid var(--line);background:#101826;color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button:hover{border-color:var(--blue)}button.pri{background:var(--grad);border:0;color:#fff}button.dn{color:var(--dn)}button.ok{color:var(--up)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--grad);border:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{color:var(--mu);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#16203a}
.pill.active{background:rgba(53,214,160,.15);color:var(--up)}.pill.pending{background:rgba(255,200,80,.15);color:#ffc850}.pill.rejected,.pill.expired{background:rgba(255,93,115,.15);color:var(--dn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mu{color:var(--mu)}.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.kp div{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0a0f18}.kp small{display:block;color:var(--mu);font-size:10.5px;letter-spacing:1px}.kp b{font-size:20px}
#login{max-width:420px;margin:12vh auto}
#toast{position:fixed;right:16px;bottom:16px;background:#101826;border:1px solid var(--blue);padding:10px 14px;border-radius:12px;display:none;max-width:340px}
.hide{display:none!important}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>XRPL<i>TODAY</i> Admin</h1><p class="mu">Enter your admin key. It stays in this tab only and is sent only to this site.</p><div class="row"><input id="key" type="password" placeholder="Admin key" style="flex:1" autocomplete="off"><button class="pri" id="go">Sign in</button></div><div id="lerr" class="mu"></div></div>
<div id="app" class="hide">
<header><h1>XRPL<i>TODAY</i> Admin</h1><span class="sp"></span><a href="/">News</a><a href="/blog">Blog</a><a href="/squares">Squares</a><a href="/stats">Analytics</a><a href="/advertise">Advertise</a><button id="out">Sign out</button></header>
<div class="tabs" id="tabs"><button data-t="ov" class="on">Overview</button><button data-t="ads">Sponsors</button><button data-t="tn">Token News</button><button data-t="blog">Blog &amp; facts</button><button data-t="tools">Tools</button></div>
<div id="ov"></div><div id="ads" class="hide"></div><div id="tn" class="hide"></div><div id="blog" class="hide"></div><div id="tools" class="hide"></div>
</div></div><div id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},K='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3500)}
function api(body){return fetch('/api/admin',{method:body?'POST':'GET',headers:{'x-admin-key':K,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){return r.json().then(function(j){if(r.status===401)throw new Error('unauthorized');if(j&&j.error)throw new Error(j.error);return j})})}
function sess(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
function login(k){K=k;api().then(function(){sess('xak',k);$('login').classList.add('hide');$('app').classList.remove('hide');loadAll()}).catch(function(e){$('lerr').textContent=e.message==='unauthorized'?'That key is not correct.':'Could not reach the admin API.'})}
$('go').onclick=function(){login($('key').value.trim())};$('key').onkeydown=function(e){if(e.key==='Enter')login(this.value.trim())};
$('out').onclick=function(){sess('xak','');location.reload()};
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});['ov','ads','tn','blog','tools'].forEach(function(t){$(t).classList.toggle('hide',t!==b.getAttribute('data-t'))})};
var TN=null,AD=null,FACTS=[],BLOGS=[],NEWS=null;
function loadAll(){Promise.all([api({action:'ad-list'}),api(),fetch('/api/blogs',{cache:'no-store'}).then(function(r){return r.json()}),fetch('/api/news',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return null})]).then(function(r){AD=r[0];FACTS=r[1].facts||[];BLOGS=r[2]||[];NEWS=r[3];draw()}).catch(function(e){toast('Load failed: '+e.message)})}
function ago(t){if(!t)return '—';var m=Math.round((Date.now()-t)/6e4);return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}
function draw(){api({action:'tn-list'}).then(function(j){TN=j;drawTn()}).catch(function(){});drawOv();drawAds();drawBlog();drawTools()}
function drawOv(){var ads=AD.ads||[],act=ads.filter(function(a){return a.status==='active'}).length,pen=ads.filter(function(a){return a.status==='pending'}).length,clicks=ads.reduce(function(s,a){return s+(a.clicks||0)},0),d=BLOGS.filter(function(b){return b.k==='d'})[0],h=BLOGS.filter(function(b){return b.k!=='d'})[0],itm=NEWS&&NEWS.items?NEWS.items.length:0;
 $('ov').innerHTML='<div class="card"><h3>Status</h3><div class="kp"><div><small>NEWS STORIES</small><b>'+itm+'</b></div><div><small>LAST NEWS REFRESH</small><b style="font-size:15px">'+ago(NEWS&&NEWS.ts)+'</b></div><div><small>BLOG POSTS</small><b>'+BLOGS.length+'</b></div><div><small>LAST HOURLY BRIEF</small><b style="font-size:15px">'+ago(h&&h.ts)+'</b></div><div><small>LAST DAILY POST</small><b style="font-size:15px">'+ago(d&&d.ts)+'</b></div><div><small>ACTIVE ADS</small><b>'+act+' / 3</b></div><div><small>PENDING ADS</small><b style="color:'+(pen?'#ffc850':'inherit')+'">'+pen+'</b></div><div><small>AD CLICKS</small><b>'+clicks+'</b></div><div><small>FACTS</small><b>'+FACTS.length+'</b></div></div></div><div class="card"><h3>Quick links</h3><div class="row"><a href="/">News terminal</a><a href="/blog">Blog</a><a href="/daily">Daily</a><a href="/squares">XRPL Squares</a><a href="/stats">Ledger Analytics</a><a href="/advertise">Advertise page</a><a href="/rss.xml">RSS</a></div></div>'}
function drawAds(){var ads=AD.ads||[],c=AD.cfg||{prices:{}};
 var h='<div class="card"><h3>Sponsor ads</h3>'+(ads.length?'<table><thead><tr><th>Slot</th><th>Ad</th><th>Status</th><th>Expires</th><th>Clicks</th><th></th></tr></thead><tbody>'+ads.map(function(a){return '<tr><td>#'+a.slot+'</td><td><b>'+esc(a.title)+'</b><br><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.url)+'</a><br><span class="mu">'+esc(a.email||'')+' · ID '+esc(a.id)+'</span></td><td><span class="pill '+esc(a.status)+'">'+esc(a.status)+'</span></td><td>'+(a.exp?new Date(a.exp).toLocaleDateString():'—')+'</td><td>'+(a.clicks||0)+'</td><td><div class="row"><input type="number" value="'+(c.days||30)+'" style="width:64px" id="d'+esc(a.id)+'" title="days"><button class="ok" data-a="ad-approve" data-id="'+esc(a.id)+'">Approve</button><button data-a="ad-reject" data-id="'+esc(a.id)+'">Reject</button><button class="dn" data-a="ad-remove" data-id="'+esc(a.id)+'">Delete</button></div></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No ads have been submitted yet.</p>')+'</div>';
 h+='<div class="card"><h3>Pricing &amp; payment</h3><div class="row"><label class="mu">Slot 1 $</label><input id="p1" type="number" value="'+((c.prices||{})[1]||99)+'" style="width:80px"><label class="mu">Slot 2 $</label><input id="p2" type="number" value="'+((c.prices||{})[2]||79)+'" style="width:80px"><label class="mu">Slot 3 $</label><input id="p3" type="number" value="'+((c.prices||{})[3]||59)+'" style="width:80px"><label class="mu">Days</label><input id="pd" type="number" value="'+(c.days||30)+'" style="width:70px"></div><div class="row"><input id="pu" placeholder="Payment link (Stripe / PayPal URL)" value="'+esc(c.payUrl||'')+'" style="flex:1;min-width:260px"><input id="pc" placeholder="Contact email" value="'+esc(c.contact||'')+'" style="width:240px"></div><button class="pri" id="psave">Save settings</button><p class="mu">Ads stay pending until you approve them. No payment is processed by this site: advertisers pay through the link above.</p></div>';
 $('ads').innerHTML=h;
 $('ads').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var act=b.getAttribute('data-a'),id=b.getAttribute('data-id');if(act==='ad-remove'&&!window.__cf){b.textContent='Click again to delete';window.__cf=1;setTimeout(function(){window.__cf=0;b.textContent='Delete'},3000);return}window.__cf=0;var body={action:act,id:id};if(act==='ad-approve')body.days=+$('d'+id).value||30;api(body).then(function(){toast('Done');loadAll()}).catch(function(x){toast(x.message)})};
 $('psave').onclick=function(){api({action:'ad-config',prices:{1:+$('p1').value,2:+$('p2').value,3:+$('p3').value},days:+$('pd').value||30,payUrl:$('pu').value.trim(),contact:$('pc').value.trim()}).then(function(){toast('Settings saved');loadAll()}).catch(function(x){toast(x.message)})}}
function drawBlog(){var h='<div class="card"><h3>Facts used by the daily BONSAI × LUMA post</h3><div class="row"><select id="fp"><option>BONSAI</option><option>LUMA</option><option>BOTH</option></select></div><textarea id="ft" placeholder="A true, current fact about BONSAI or LUMA. If something is planned or in development, say so."></textarea><div class="row" style="margin-top:8px"><button class="pri" id="fa">Add fact</button></div>'+(FACTS.length?'<table style="margin-top:10px"><thead><tr><th>Product</th><th>Fact</th><th>Used</th><th></th></tr></thead><tbody>'+FACTS.map(function(f){return '<tr><td>'+esc(f.p)+'</td><td>'+esc(f.t)+'</td><td>'+(f.used||0)+'×</td><td><button class="dn" data-f="'+esc(f.id)+'">Remove</button></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No facts yet.</p>')+'</div>';
 h+='<div class="card"><h3>Blog posts</h3>'+(BLOGS.length?'<table><thead><tr><th>Title</th><th>Type</th><th>Published</th><th></th></tr></thead><tbody>'+BLOGS.slice(0,40).map(function(b){return '<tr><td><a href="/blog/'+esc(b.slug)+'" target="_blank">'+esc(b.title||b.slug)+'</a></td><td>'+(b.k==='d'?'Daily':'Hourly')+'</td><td>'+ago(b.ts)+'</td><td><button class="dn" data-p="'+esc(b.slug)+'">Delete</button></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No posts yet.</p>')+'</div>';
 $('blog').innerHTML=h;
 $('fa').onclick=function(){var t=$('ft').value.trim();if(!t)return;api({action:'add',product:$('fp').value,text:t}).then(function(){toast('Fact added');loadAll()}).catch(function(x){toast(x.message)})};
 $('blog').onclick=function(e){var f=e.target.closest('[data-f]'),p=e.target.closest('[data-p]');if(f)api({action:'remove',id:f.getAttribute('data-f')}).then(function(){toast('Removed');loadAll()});if(p){if(p.getAttribute('data-c')!=='1'){p.setAttribute('data-c','1');p.textContent='Click again to delete';return}api({action:'delete-post',slug:p.getAttribute('data-p')}).then(function(){toast('Post deleted');loadAll()})}}}
function drawTn(){var subs=(TN&&TN.subs)||[],c=(TN&&TN.cfg)||{addr:'',price:50};
 var h='<div class="card"><h3>Token News payment settings</h3><div class="row"><input id="tna" placeholder="XRPL receiving address (r…)" value="'+esc(c.addr||'')+'" style="flex:1;min-width:260px"><input id="tnp" type="number" value="'+(c.price||50)+'" style="width:90px"><span class="mu">XRP</span><button class="pri" id="tnsave">Save</button></div><p class="mu">Submitters pay this address and paste the transaction hash. The site checks the payment on the XRP Ledger automatically. Submissions stay hidden until you approve them.</p></div>';
 h+='<div class="card"><h3>Submissions</h3>'+(subs.length?'<table><thead><tr><th>Post</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>'+subs.map(function(s){return '<tr><td><b>'+esc(s.title)+'</b><br><span class="mu">'+esc(s.token)+' · '+esc(s.email)+(s.link?' · <a href="'+esc(s.link)+'" target="_blank" rel="noopener">link</a>':'')+'</span><details><summary class="mu">Read</summary><div style="white-space:pre-wrap;max-width:520px">'+esc(s.body)+'</div></details></td><td>'+(s.paid?'<span class="pill active">verified</span>':'<span class="pill pending">unverified</span><br><span class="mu">'+esc(s.why||'')+'</span>')+'<br><a href="https://livenet.xrpl.org/transactions/'+esc(s.tx)+'" target="_blank" rel="noopener">tx ↗</a></td><td><span class="pill '+(s.status==='approved'?'active':s.status==='rejected'?'rejected':'pending')+'">'+esc(s.status)+'</span></td><td><div class="row"><button class="ok" data-tn="tn-approve" data-id="'+esc(s.id)+'">Approve</button><button data-tn="tn-reject" data-id="'+esc(s.id)+'">Reject</button><button data-tn="tn-recheck" data-id="'+esc(s.id)+'">Re-check pay</button>'+(s.slug?'<a class="btn" href="/tokens/'+esc(s.slug)+'" target="_blank">View</a>':'')+'<button class="dn" data-tn="tn-remove" data-id="'+esc(s.id)+'">Delete</button></div></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No submissions yet.</p>')+'</div>';
 $('tn').innerHTML=h;
 $('tnsave').onclick=function(){api({action:'tn-config',addr:$('tna').value.trim(),price:+$('tnp').value||50}).then(function(){toast('Saved');loadAll()}).catch(function(x){toast(x.message)})};
 $('tn').onclick=function(e){var b=e.target.closest('[data-tn]');if(!b)return;var a=b.getAttribute('data-tn');if(a==='tn-remove'&&b.getAttribute('data-c')!=='1'){b.setAttribute('data-c','1');b.textContent='Click again';return}api({action:a,id:b.getAttribute('data-id')}).then(function(j){toast(a==='tn-recheck'?(j.paid?'Payment verified':'Not verified'):'Done');loadAll()}).catch(function(x){toast(x.message)})}}
function drawTools(){$('tools').innerHTML='<div class="card"><h3>Actions</h3><div class="row"><button class="pri" id="t1">Refresh news now</button><button id="t2">Generate daily post now</button><button id="t3">Reload data</button></div><p class="mu">Generating a post uses Workers AI and can take up to a minute. A daily post is only added when generation passes its quality checks.</p><div id="tr" class="mu"></div></div><div class="card"><h3>Export</h3><div class="row"><a href="/api/export" target="_blank">Download full archive (JSON)</a></div></div>';
 $('t1').onclick=function(){$('tr').textContent='Refreshing…';fetch('/api/refresh',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){$('tr').textContent='Done: '+JSON.stringify(j).slice(0,300);loadAll()}).catch(function(e){$('tr').textContent='Failed: '+e.message})};
 $('t2').onclick=function(){$('tr').textContent='Generating… please wait';api({action:'daily'}).then(function(j){$('tr').textContent='Result: '+JSON.stringify(j).slice(0,300);loadAll()}).catch(function(e){$('tr').textContent='Failed: '+e.message})};
 $('t3').onclick=loadAll}
var s=sess('xak');if(s)login(s);
})();
</script></body></html>
