<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>XRPLTODAY Admin</title>
<style>

button:hover{border-color:var(--blue)}button.pri{background:var(--grad);border:0;color:#fff}button.dn{color:var(--dn)}button.ok{color:var(--up)}

.hide{display:none!important}
</style></head><body><div class="wrap">

 $('ads').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var act=b.getAttribute('data-a'),id=b.getAttribute('data-id');if(act==='ad-remove'&&!window.__cf){b.textContent='Click again to delete';window.__cf=1;setTimeout(function(){window.__cf=0;b.textContent='Delete'},3000);return}window.__cf=0;var body={action:act,id:id};if(act==='ad-approve')body.days=+$('d'+id).value||30;api(body).then(function(){toast('Done');loadAll()}).catch(function(x){toast(x.message)})};
 $('psave').onclick=function(){api({action:'ad-config',prices:{1:+$('p1').value,2:+$('p2').value,3:+$('p3').value},days:+$('pd').value||30,payUrl:$('pu').value.trim(),contact:$('pc').value.trim()}).then(function(){toast('Settings saved');loadAll()}).catch(function(x){toast(x.message)})}}
function drawBlog(){var h='<div class="card"><h3>Facts used by the daily BONSAI × LUMA post</h3><div class="row"><select id="fp"><option>BONSAI</option><option>LUMA</option><option>BOTH</option></select></div><textarea id="ft" placeholder="A true, current fact about BONSAI or LUMA. If something is planned or in development, say so."></textarea><div class="row" style="margin-top:8px"><button class="pri" id="fa">Add fact</button></div>'+(FACTS.length?'<table style="margin-top:10px"><thead><tr><th>Product</th><th>Fact</th><th>Used</th><th></th></tr></thead><tbody>'+FACTS.map(function(f){return '<tr><td>'+esc(f.p)+'</td><td>'+esc(f.t)+'</td><td>'+(f.used||0)+'×</td><td><button class="dn" data-f="'+esc(f.id)+'">Remove</button></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No facts yet.</p>')+'</div>';
 h+='<div class="card"><h3>Blog posts</h3>'+(BLOGS.length?'<table><thead><tr><th>Title</th><th>Type</th><th>Published</th><th></th></tr></thead><tbody>'+BLOGS.slice(0,40).map(function(b){return '<tr><td><a href="/blog/'+esc(b.slug)+'" target="_blank">'+esc(b.title||b.slug)+'</a></td><td>'+(b.k==='d'?'Daily':'Hourly')+'</td><td>'+ago(b.ts)+'</td><td><button class="dn" data-p="'+esc(b.slug)+'">Delete</button></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No posts yet.</p>')+'</div>';
 $('blog').innerHTML=h;
 $('fa').onclick=function(){var t=$('ft').value.trim();if(!t)return;api({action:'add',product:$('fp').value,text:t}).then(function(){toast('Fact added');loadAll()}).catch(function(x){toast(x.message)})};
 $('blog').onclick=function(e){var f=e.target.closest('[data-f]'),p=e.target.closest('[data-p]');if(f)api({action:'remove',id:f.getAttribute('data-f')}).then(function(){toast('Removed');loadAll()});if(p){if(p.getAttribute('data-c')!=='1'){p.setAttribute('data-c','1');p.textContent='Click again to delete';return}api({action:'delete-post',slug:p.getAttribute('data-p')}).then(function(){toast('Post deleted');loadAll()})}}}
function drawTn(){var subs=(TN&&TN.subs)||[],c=(TN&&TN.cfg)||{addr:'',price:50};
 var h='<div class="card"><h3>XRPL Token News payment settings</h3><div class="row"><input id="tna" placeholder="XRPL receiving address (r…)" value="'+esc(c.addr||'')+'" style="flex:1;min-width:260px"><input id="tnp" type="number" value="'+(c.price||50)+'" style="width:90px"><span class="mu">XRP</span><button class="pri" id="tnsave">Save</button></div><p class="mu">Submitters pay this address and paste the transaction hash. The site checks the payment on the XRP Ledger automatically. Submissions stay hidden until you approve them.</p></div>';
 h+='<div class="card"><h3>Submissions</h3>'+(subs.length?'<table><thead><tr><th>Post</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>'+subs.map(function(s){return '<tr><td><b>'+esc(s.title)+'</b><br><span class="mu">'+esc(s.token)+' · '+esc(s.email)+(s.link?' · <a href="'+esc(s.link)+'" target="_blank" rel="noopener">link</a>':'')+'</span><details><summary class="mu">Read</summary><div style="white-space:pre-wrap;max-width:520px">'+esc(s.body)+'</div></details></td><td>'+(s.paid?'<span class="pill active">verified</span>':'<span class="pill pending">unverified</span><br><span class="mu">'+esc(s.why||'')+'</span>')+'<br><a href="https://livenet.xrpl.org/transactions/'+esc(s.tx)+'" target="_blank" rel="noopener">tx ↗</a></td><td><span class="pill '+(s.status==='approved'?'active':s.status==='rejected'?'rejected':'pending')+'">'+esc(s.status)+'</span></td><td><div class="row"><button class="ok" data-tn="tn-approve" data-id="'+esc(s.id)+'">Approve</button><button data-tn="tn-reject" data-id="'+esc(s.id)+'">Reject</button><button data-tn="tn-recheck" data-id="'+esc(s.id)+'">Re-check pay</button>'+(s.slug?'<a class="btn" href="/tokens/'+esc(s.slug)+'" target="_blank">View</a>':'')+'<button class="dn" data-tn="tn-remove" data-id="'+esc(s.id)+'">Delete</button></div></td></tr>'}).join('')+'</tbody></table>':'<p class="mu">No submissions yet.</p>')+'</div>';
 $('tn').innerHTML=h;
 $('tnsave').onclick=function(){api({action:'tn-config',addr:$('tna').value.trim(),price:+$('tnp').value||50}).then(function(){toast('Saved');loadAll()}).catch(function(x){toast(x.message)})};
 $('tn').onclick=function(e){var b=e.target.closest('[data-tn]');if(!b)return;var a=b.getAttribute('data-tn');if(a==='tn-remove'&&b.getAttribute('data-c')!=='1'){b.setAttribute('data-c','1');b.textContent='Click again';return}api({action:a,id:b.getAttribute('data-id')}).then(function(j){toast(a==='tn-recheck'?(j.paid?'Payment verified':'Not verified'):'Done');loadAll()}).catch(function(x){toast(x.message)})}}
function drawTools(){$('tools').innerHTML='<div class="card"><h3>Actions</h3><div class="row"><button class="pri" id="t1">Refresh news now</button><button id="t2">Generate daily post now</button><button id="t3">Reload data</button></div><p class="mu">Generating a post uses Workers AI and can take up to a minute. A daily post is only added when generation passes its quality checks.</p><div id="tr" class="mu"></div></div><div class="card"><h3>Export</h3><div class="row"><a href="/api/export" target="_blank">Download full archive (JSON)</a></div></div>';
 $('t1').onclick=function(){$('tr').textContent='Refreshing…';fetch('/api/refresh',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){$('tr').textContent='Done: '+JSON.stringify(j).slice(0,300);loadAll()}).catch(function(e){$('tr').textContent='Failed: '+e.message})};
 $('t2').onclick=function(){$('tr').textContent='Generating… please wait';api({action:'daily'}).then(function(j){$('tr').textContent='Result: '+JSON.stringify(j).slice(0,300);loadAll()}).catch(function(e){$('tr').textContent='Failed: '+e.message})};
 $('t3').onclick=loadAll}
var s=sess('xak');if(s)login(s);
})();
</script></body></html>
