name: Archive posts
on:
  schedule: [{ cron: '30 17 * * *' }]   # daily, after the 16:00 UTC BONSAI x LUMA post
  workflow_dispatch:
permissions: { contents: write }
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/archive.mjs
        env: { SITE: ${{ vars.SITE_URL }} }
      - run: |
          git config user.name "xrpldaily-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "archive: sync posts and facts") && git push
